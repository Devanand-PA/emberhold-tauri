name: Desktop releases

# Builds installers for Windows (x64), macOS (Apple Silicon + Intel) and Linux
# (x64 .deb/.rpm) and uploads them to a draft GitHub release.
# Trigger: push a v* tag, or run manually from the Actions tab.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS (Intel)
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: Linux (x64)
            platform: ubuntu-22.04
            args: ""
          - name: Windows (x64)
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Emberhold v__VERSION__"
          releaseBody: |
            Desktop builds for Windows, macOS and Linux.
            The Android APK is uploaded as an artifact by the **Android APK** workflow.
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}
