name: Release

# ONE workflow -> ONE GitHub release. Builds Windows (x64), macOS (Apple
# Silicon + Intel), Linux (x64 .deb/.rpm/.AppImage) and Android (APK + AAB,
# per-ABI split) and attaches EVERY artifact to the same release.
#
# A `setup` job creates the release first; the parallel platform jobs then
# only attach assets, so concurrent builds can never race into two releases
# for the same tag.
#
# Android signing:
#   For update-compatible release signing, configure repository secrets:
#     ANDROID_KEYSTORE_BASE64  - base64-encoded .jks/.keystore file
#     ANDROID_KEYSTORE_PASSWORD
#     ANDROID_KEY_ALIAS
#     ANDROID_KEY_PASSWORD
#   If these are not set, the workflow generates a temporary CI signing key so
#   release APKs remain installable, but upgrades will not be signature-compatible
#   across different CI-generated keys.
#
# The Linux `--bundles` argument overrides tauri.linux.conf.json so an
# AppImage is produced in CI; tauri-action uploads all bundles it finds
# (including *.AppImage) to the release alongside the .deb/.rpm packages.
#
# Trigger: push a v* tag, or run manually from the Actions tab.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ANDROID_PLATFORM: "36"
  NDK_VERSION: 27.0.12077973

jobs:
  setup:
    name: Create GitHub release
    runs-on: ubuntu-22.04

    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version=$(node -p "require('./package.json').version")
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi

      # Create the release ONCE up front; every build job attaches to it.
      - name: Create GitHub release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Emberhold ${{ steps.tag.outputs.tag }}
          body: |
            Windows, macOS (Apple Silicon + Intel), Linux and Android builds.
            See the assets to download and install.
          draft: false
          prerelease: false

  build-desktop:
    name: ${{ matrix.name }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            platform: windows-latest
            args: ""
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS (Intel)
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: Linux (x64)
            platform: ubuntu-22.04
            # Override the repo's tauri.linux.conf.json targets (deb/rpm) so
            # the AppImage is built too.
            args: "--bundles deb,rpm,appimage"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # frontend/ is generated (gitignored); rebuild it from the game submodule
      # before tauri-action packages the app.
      - name: Generate frontend from game submodule
        run: npm run sync

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Attach to the release `setup` already created — no racing creation.
          releaseId: ${{ needs.setup.outputs.release_id }}
          tagName: ${{ needs.setup.outputs.tag }}
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}

  build-android:
    name: Android (APK + AAB)
    needs: setup
    runs-on: ubuntu-22.04

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default "tools" package was retired by Google and makes
          # sdkmanager fail, so install only the cmdline tools we actually use.
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-${{ env.ANDROID_PLATFORM }}" \
            "build-tools;${{ env.ANDROID_PLATFORM }}.0.0" \
            "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # frontend/ is generated (gitignored); rebuild it from the game submodule
      # before Tauri reads frontendDist.
      - name: Generate frontend from game submodule
        run: npm run sync

      # The Tauri Android project is generated during the run with `tauri android init`.
      - name: Initialize the Tauri Android project
        run: npx tauri android init --ci

      # Tauri's Android template only draws edge-to-edge; it never hides the
      # system bars. Patch the generated MainActivity for immersive fullscreen.
      - name: Enable immersive fullscreen in the Android app
        run: node scripts/patch-android-fullscreen.mjs

      - name: Match generated Gradle config to installed SDK
        run: |
          # Tauri's template currently targets API 37; the GitHub runner's
          # sdkmanager only offers API 36, so build against 36 instead.
          sed -i -E 's/(compileSdk|targetSdk) = 37/\1 = ${{ env.ANDROID_PLATFORM }}/' \
            src-tauri/gen/android/app/build.gradle.kts

      - name: Configure Android release signing
        run: python3 scripts/patch-android-signing.py

      - name: Build Android release artifacts
        run: npx tauri android build --apk --aab --split-per-abi --target aarch64 --target armv7 --ci

      # Attach installable release artifacts directly to the same release
      # (raw files, not zipped workflow artifacts). The release already
      # exists (created by `setup`), so this only adds assets.
      - name: Attach Android artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: Emberhold ${{ needs.setup.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
