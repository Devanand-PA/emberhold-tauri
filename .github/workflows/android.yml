name: Android APK

# Builds installable (debug-signed) Android APKs for common phone ABIs.
# The Tauri Android project is generated during the run with `tauri android init`.
# Finished APKs are split per ABI and attached directly to the GitHub release
# (as raw files, not zipped workflow artifacts), so they download ready to install.
# For smaller distribution artifacts, prefer signed release builds/AABs with ABI splits.
# Trigger: push a v* tag, or run manually from the Actions tab.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NDK_VERSION: 27.0.12077973
  ANDROID_PLATFORM: 36

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default "tools" package was retired by Google and makes
          # sdkmanager fail, so install only the cmdline tools we actually use.
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-${{ env.ANDROID_PLATFORM }}" \
            "build-tools;${{ env.ANDROID_PLATFORM }}.0.0" \
            "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # frontend/ is generated (gitignored); rebuild it from the game submodule
      # before Tauri reads frontendDist.
      - name: Generate frontend from game submodule
        run: npm run sync

      - name: Initialize the Tauri Android project
        run: npx tauri android init --ci

      - name: Match generated Gradle config to installed SDK
        run: |
          # Tauri's template currently targets API 37; the GitHub runner's
          # sdkmanager only offers API 36, so build against 36 instead.
          sed -i -E 's/(compileSdk|targetSdk) = 37/\1 = ${{ env.ANDROID_PLATFORM }}/' \
            src-tauri/gen/android/app/build.gradle.kts

      - name: Build APK
        run: npx tauri android build --apk --debug --split-per-abi --target aarch64 --target armv7 --ci

      - name: Determine release tag
        id: release
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version=$(node -p "require('./package.json').version")
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi

      # Attach the .apk itself to the release so users download an installable
      # APK, not a ZIP-wrapped workflow artifact. Matches the release the
      # desktop workflow creates for the same tag.
      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Emberhold ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

# Re-pushed so GitHub picks up the workflow.
