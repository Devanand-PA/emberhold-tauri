# =============================================================================
# BOSS DATA — the single source of truth for every warlord in the game.
# =============================================================================
#   
# WHAT THIS FILE IS
#   Every boss (warlord) the game can spawn is defined here: base stats,
#   abilities, looks, depth tier, dungeon themes, defense identity, spawn
#   tuning, tricks and battle-cries. Edit this file to rebalance bosses —
#   you never need to touch JavaScript for a numbers pass.
#
# HOW IT LOADS (one-time cost, zero per-frame cost)
#   1. At page load, src/app/boss_data.js fetches this file ONCE (async,
#      while the title screen is up) and parses it into plain objects.
#   2. The parsed tables are written straight into the live config
#      (CFG.MOB_TEMPLATES, CFG.BOSS_MIN_EFF, CFG.BOSS_THEMES,
#      CFG.BOSS_BULWARK, CFG.BOSS_HP_TRIM, CFG.BOSS_TIER_BULK,
#      CFG.BOSS_MAGIC_TIER) — the exact same hash-map slots the spawner,
#      the codex and the practice summoner already read.
#   3. After that the YAML text is never touched again: spawning does no
#      parsing, no fetching, no string work — just number math. Rebalance
#      all you like; the running game costs nothing extra.
#   If the file ever fails to load (offline preview without the service
#   worker, deleted file, typo), the game logs a warning and keeps the
#   built-in defaults compiled into src/core/config.js + the dim packs,
#   so the game always boots. Fix the file, reload, done.
#
# THE SPAWN PIPELINE (what each number below actually does)
#   a. Template body: hp/mp/atk/def/spd/xp are the LEVEL-1 body.
#   b. Level growth: every stat grows with level (src/world/entities.js
#      mobGrowth/mobScaledStat — casters favor MP/matk, bruisers ATK/HP,
#      tanks DEF; bosses also scale harder per tier). Spawn level itself
#      comes from depth (Game.bossLevelFor), NOT from this file.
#   c. Tier bulk (tier_bulk below): flat per-tier multipliers applied AFTER
#      growth. HP carries tier identity (low tiers pool UP, hell tiers pool
#      DOWN vs the old x100 band); ATK/MATK climb gently; DEF is a flat
#      band. The codex mirrors this exact math, so codex numbers match
#      spawned numbers.
#   d. hp_trim: per-boss fine correction so each spawn pool lands ON the
#      distribution table (pools vary beyond what the level curve
#      derives — dragons pool deeper than their XP says). 1 = exact tier
#      mean. Values carry ~1% probe noise; well inside spawn jitter.
#   e. Bulwark (frail/weak): each warlord's spell defence (sdef) runs off
#      its physical DEF — frail:mag means sdef ~15% BELOW def (spells
#      hurt), frail:phys means sdef ~15% ABOVE def. weak: <element> is
#      the thematic ~+10% damage weakness (see dealDamage).
#   f. Spawn jitter: bosses roll near-template — HP/MP/ATK +-~3%, exact
#      DEF/SDEF (the old +-8% coin-flip on small bodies is gone).
#   g. XP: xpReward = xp * (1 + (lv-1)*0.22) * (1 + (tier-1)*0.25),
#      then +-10% individual jitter.
#   h. Arsenal: abilities below are SIGNATURES — the boss always brings
#      them. The spawner then tops up a 12-pick loadout with pooled
#      spells/techniques up to magic_tier[tier] (deeper tiers = deeper
#      magic), plus self-care is always included. Never put eject,
#      grapple, revive or angel_of_life in a signature list unless you
#      mean it — no mob AI casts eject/grapple/revive.
#
# FIELD LEGEND (per boss entry)
#   name      Display name.
#   hp/mp/atk/def/spd/xp
#             Level-1 template body (see pipeline above). def is the base
#             physical DEF before the tier DEF band; spd in tiles/sec-ish.
#   abilities Signatures, always kept (see h). Spell/technique ids from
#             CFG.ABILITIES / techniques — must exist or they are skipped.
#   body      Mover + art plan: humanoid | brute | beast | serpent |
#             winged | ghost | swarm | blob | construct | undead.
#   tint      Hex color for the sprite painter. ALWAYS quoted (a bare #
#             starts a YAML comment!).
#   tier      Depth tier 1-12 = BOSS_MIN_EFF: minimum effective depth to
#             wake (eff 1-2 hedge only ... eff 6+ ancient horrors, eff 8+
#             hell warlords, eff 12 Peter + goddess). ALSO the scaling tier
#             (growth rate + tier_bulk row + magic tier).
#   themes    Dungeon themes this warlord haunts (bossKindFor filters the
#             depth-eligible roster by theme). crypt/shadow/tomb/cavern/
#             fungal/grove/flooded/wreck/leviathan/ember/storm/glacier/
#             briar/hive/mirror/library/flesh/clockwork/abyss/inferno/dawn.
#   frail/weak  Bulwark identity (see e). frail: mag | phys,
#             weak: holy|fire|ice|water|electric|nature.
#   hp_trim   Spawn-pool fine correction (see d). Omit (or 1) = tier mean.
#   say       Battle-cry toast on wake. ALWAYS quoted (emojis/colons!).
#   tricks    Boss-fight mechanics (bossMech): meteor | nova | adds |
#             beam | blink | charm | quake | tide | white | split...
#             Only hell/heaven warlords use these today; surface lords
#             omit the line. The boss tick reads them for adds/waves.
#   flags     Boolean extras (omit the line when empty):
#               archer  — fires arrows as well as spells
#               aquatic + diver — dives (leviathan deep, drowned lords)
#               burrower — land-digger (implies diver on solid ground)
#               undead  — holy-vulnerable, rises only at night/dark
#               lavaBorn — swims in magma
#               passive + docile — heaven serenes: calm until provoked
#   roster    Where this entry is wired (loader ensures membership):
#               surface — surface delve roster (BOSS_KINDS)
#               hell    — hell delve roster (BOSS_KINDS + HELL_BOSS_KINDS)
#               heaven  — heaven roster (BOSS_KINDS + HEAVEN_BOSS_KINDS)
#               special — NOT a roster pick. portal_devourer only ever
#                         wears the way-down portal; goddess is planted
#                         on demand (pantheon / practice summoner).
#             warlord true = also a BOSS_KINDS pick (false ONLY for the
#             threshold devourer — flip it to true and it starts ruling
#             delves like any tier-1 lord).
#
# HOW TO ADD A NEW BOSS
#   1. Copy any entry, new kind key (lowercase, underscores).
#   2. Set stats/abilities/body/tint, tier + themes so it can be picked.
#   3. Set roster: surface|hell|heaven (+ warlord: true to rule delves).
#   4. Reload — codex, delves, practice summoner all see it instantly.
#   Art: surface lords get custom painters in src/actors/bosses.js;
#   hell/heaven looks come from LOOKS tables in the dim packs.
#
# HOW TO RETIRE A BOSS (without deleting history)
#   Set warlord: false + themes: [] — it stops spawning but stays
#   summonable from practice and visible in the codex.
#
# =============================================================================

meta:
  version: 1   # bump when you change this file's SHAPE (loader warns on mismatch)

# ---- per-tier warlord bulk: flat multipliers over the level-grown body ----
# HP carries tier identity; ATK/MATK climb gently; DEF is a flat band.
# Read by the spawner (entities.js makeMob) AND the codex — single source.
tier_bulk:
  hp:
    1: 33.27
    2: 33.12
    3: 25.45
    4: 17.52
    5: 15.15
    6: 16.17
    7: 26
    8: 5.44
    9: 26
    10: 26
    11: 1.92
    12: 1.35
  atk:
    1: 0.99
    2: 1.08
    3: 1.16
    4: 1.24
    5: 1.33
    6: 1.41
    7: 1.48
    8: 1.64
    9: 1.48
    10: 1.48
    11: 1.8
    12: 1.89
  matk:
    1: 1.01
    2: 1.09
    3: 1.17
    4: 1.24
    5: 1.32
    6: 1.4
    7: 1.48
    8: 1.63
    9: 1.48
    10: 1.48
    11: 1.81
    12: 1.87
  def:
    1: 2.5
    2: 2.5
    3: 3
    4: 3
    5: 3
    6: 3
    7: 3
    8: 3
    9: 3
    10: 3
    11: 3
    12: 3.4

# ---- max bonus-magic tier a warlord's arsenal reaches, by unlock depth ----
# eff1 -> hedge, eff2-3 -> +battle, eff4 -> +war, eff5+ -> cataclysms.
# (Template signatures + self-care always stay, whatever the tier.)
magic_tier:
  1: 1
  2: 2
  3: 2
  4: 3
  5: 4
  6: 4

